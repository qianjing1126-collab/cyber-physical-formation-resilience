[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tnsm-sim"
version = "0.1.0"
description = "Research simulations for cyber-physical resilience in networked cooperative formation systems"
requires-python = ">=3.11"
dependencies = [
    "cvxpy>=1.9.2",
    "matplotlib>=3.11.1",
    "numpy>=1.26",
    "scipy>=1.14",
]

[project.scripts]
tnsm-sim = "tnsm_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
